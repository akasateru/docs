<h1 style="margin: 0; font-size: 52px; line-height: 1.35; font-weight: 900">銀の弾丸はない。あらゆる判断は、何かを得るために何かを犠牲にする。</h1>

<div style="margin-top: auto; border: 2px solid #5EEAD4; border-radius: 12px; padding: 22px 32px; font-size: 24px; line-height: 1.6; font-weight: 500"><span style="font-weight: 900; color: #5EEAD4">黄金律</span>　選択肢は好みではなく、凝集性・結合度・整合性要件などを軸にした定量的・構造的な分析で比べ、その根拠をADRとして残す。</div>
